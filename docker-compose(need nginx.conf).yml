version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: ipv4-calculator
    ports:
      - "3333:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - ipv4-network

networks:
  ipv4-network:
    driver: bridge
